name: planetory-distributed-system

services:
  airflow-scheduler:
    image: ${AIRFLOW_IMAGE:-local/planetory-airflow:not-configured}
    platform: linux/arm64
    restart: unless-stopped
    command: ["scheduler"]
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DATABASE_URL:-sqlite:////tmp/not-configured.db}
    volumes:
      - ${HADOOP_CONF_PATH:-/etc/hadoop}:/etc/hadoop:ro
    network_mode: host

  airflow-webserver:
    image: ${AIRFLOW_IMAGE:-local/planetory-airflow:not-configured}
    platform: linux/arm64
    restart: unless-stopped
    command: ["webserver"]
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DATABASE_URL:-sqlite:////tmp/not-configured.db}
    volumes:
      - ${HADOOP_CONF_PATH:-/etc/hadoop}:/etc/hadoop:ro
    network_mode: host

  ingestion:
    image: ${INGESTION_IMAGE:-local/planetory-ingestion:not-configured}
    platform: linux/arm64
    profiles: ["jobs"]
    volumes:
      - ${HADOOP_CONF_PATH:-/etc/hadoop}:/etc/hadoop:ro
      - ${STAGING_PATH:-/srv/planetory/staging}:/staging
    network_mode: host

  spark-submit:
    image: ${SPARK_JOB_IMAGE:-local/planetory-spark-job:not-configured}
    platform: linux/arm64
    profiles: ["jobs"]
    volumes:
      - ${HADOOP_CONF_PATH:-/etc/hadoop}:/etc/hadoop:ro
    network_mode: host

  publisher:
    image: ${PUBLISHER_IMAGE:-local/planetory-publisher:not-configured}
    platform: linux/arm64
    profiles: ["jobs"]
    volumes:
      - ${HADOOP_CONF_PATH:-/etc/hadoop}:/etc/hadoop:ro
      - ${GOLD_STAGING_PATH:-/srv/planetory/gold-staging}:/gold-staging
    network_mode: host
