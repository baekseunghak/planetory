[project]
name = "local-seed"
version = "0.1.0"
description = "Planetory local integration-test seed: synthetic Gold and tutorial/challenge settings (S15P21C206-256)"
requires-python = ">=3.11"
dependencies = [
  "astro-kernel[bls]",
  "numpy>=1.26,<3",
  "psycopg[binary]>=3.2,<4",
  "jsonschema>=4.18,<5",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<10",
]

[tool.uv]
package = false

[tool.uv.sources]
astro-kernel = { path = "../../../libs/astro-kernel", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
