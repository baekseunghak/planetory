[project]
name = "gold-roundtrip"
version = "0.1.0"
description = "Planetory Gold payload example, PostgreSQL round-trip check and publication QA fixtures (S15P21C206-117)"
requires-python = ">=3.11"
dependencies = [
  "tess-fixture",
  "tess-bench",
  "astro-kernel",
  "numpy>=1.26,<3",
  "astropy>=6.0,<8",
  "psycopg[binary]>=3.2,<4",
  "jsonschema>=4.18,<5",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<10",
]

[tool.uv]
package = false

[tool.uv.sources]
tess-fixture = { path = "../tess-fixture", editable = true }
tess-bench = { path = "../tess-bench", editable = true }
astro-kernel = { path = "../../libs/astro-kernel", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
