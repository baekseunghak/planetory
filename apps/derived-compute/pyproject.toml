[project]
name = "derived-compute"
version = "0.1.0"
description = "Planetory online residual and periodogram worker (S15P21C206-88)"
requires-python = ">=3.11"
dependencies = [
  "astro-kernel[bls]",
  "numpy>=1.26,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<10",
]

[tool.uv]
package = false

[tool.uv.sources]
astro-kernel = { path = "../../libs/astro-kernel", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
