map $arg_error $oauth_failure {
    default authentication_failed;
    access_denied access_denied;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker의 내장 DNS로 backend를 요청 시점에 해석한다. 리터럴 호스트명은 기동
    # 시점에 해석되므로 backend를 함께 올리지 않는 배포(`up -d --no-deps`)에서
    # nginx 자체가 기동에 실패했다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend:8080;

    # ponytail: backend 미가동(502/504)일 때만 세션 조회를 401로 낮춰 SPA가
    # 오류 화면 대신 로그인 화면으로 이동하게 한다. 장애를 인증 만료처럼 보이게
    # 하는 절충이며, 상태 구분이 필요해지면 헬스체크(S15P21C206-93)에서 다룬다.
    location = /api/v1/me {
        proxy_intercept_errors on;
        error_page 502 504 = @session_unavailable;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location @session_unavailable {
        add_header Cache-Control "no-store" always;
        return 401;
    }

    # Service compose places frontend and backend on the same Docker network.
    # API failures must not be converted into a successful index.html response.
    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Keep the SPA /login page; only provider entry and backend callbacks proxy.
    location /oauth2/ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /login/oauth2/ {
        # Only navigation failures return to the SPA; API status codes are preserved.
        proxy_intercept_errors on;
        error_page 401 403 503 = @oauth_failed;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location @oauth_failed {
        add_header Cache-Control "no-store" always;
        return 302 /oauth/callback?error=$oauth_failure;
    }
    location /assets/ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
