server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Service compose places frontend and backend on the same Docker network.
    # API failures must not be converted into a successful index.html response.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
    }
    location /assets/ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
