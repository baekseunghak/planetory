# Cloudflare edge가 준 원래 스킴을 보존한다. cloudflared는 nginx에 평문으로 붙으므로
# $scheme은 항상 http이고, 그대로 넘기면 Spring이 리다이렉트를 http://host:8080으로 만든다.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $arg_error $oauth_failure {
    default authentication_failed;
    access_denied access_denied;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    # 상대 Location을 그대로 보낸다. 기본값 on이면 리스닝 포트(8080)를 붙여
    # Tunnel 뒤에서 https://planetory.space:8080/... 으로 새어나간다.
    absolute_redirect off;
    index index.html;

    # Docker의 내장 DNS로 backend를 요청 시점에 해석한다. 리터럴 호스트명은 기동
    # 시점에 해석되므로 backend를 함께 올리지 않는 배포(`up -d --no-deps`)에서
    # nginx 자체가 기동에 실패했다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend:8080;

    # /api/v1/me에 특수 처리를 두지 않는다. 한때 502·504를 401로 낮춰 SPA가 오류
    # 화면 대신 로그인 화면으로 가게 했으나, 프론트의 공통 인증 만료 처리가 그 401을
    # 받아 세션을 비우고 보관 중인 분석 초안까지 지웠다. 백엔드가 잠깐 흔들린 것을
    # 세션 만료로 바꿔 사용자 작업물을 잃게 만드는 절충이었다.
    #
    # 이제 이 경로도 다른 API와 같이 일반 /api/ 블록으로 내려가 상태 코드를 그대로
    # 전달한다. 미로그인 판정은 백엔드가 낸 실제 401에만 의존한다. 장애와 만료를
    # 화면에서 구분하는 일은 헬스체크(S15P21C206-93)에서 다룬다.

    # Service compose places frontend and backend on the same Docker network.
    # API failures must not be converted into a successful index.html response.
    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
    }
    # Keep the SPA /login page; only provider entry and backend callbacks proxy.
    location /oauth2/ {
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
    }
    location /login/oauth2/ {
        # Only navigation failures return to the SPA; API status codes are preserved.
        proxy_intercept_errors on;
        error_page 401 403 503 = @oauth_failed;
        proxy_pass http://$backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $http_host;
    }
    location @oauth_failed {
        add_header Cache-Control "no-store" always;
        return 302 /oauth/callback?error=$oauth_failure;
    }
    location /assets/ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
