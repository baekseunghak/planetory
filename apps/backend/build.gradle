plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.planetory'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.session:spring-session-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	// 회원·커뮤니티 등 관계형 도메인은 JPA, 배열·JSONB 중심의 탐사 데이터는 JdbcClient를 함께 사용한다.
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	// DB 역할·권한 테스트 전용. 역할은 스키마가 아니라 클러스터 전역이라 공용 개발 DB를
	// 오염시키므로 일회용 컨테이너에서 검증한다. 그 밖의 테스트는 기존 스키마 격리를 쓴다.
	// Boot 4.1.1의 의존성 관리에 Testcontainers가 없어 BOM을 직접 들여온다.
	testImplementation platform('org.testcontainers:testcontainers-bom:1.21.3')
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 로컬 개발 편의: bootRun·test 전에 루트 Compose의 service-db를 띄운다(이미 떠 있으면 바로 끝남).
// CI·컨테이너 안에서는 CI=true 또는 SKIP_LOCAL_DB=true, 수동으로는 -PskipLocalDb로 건너뛴다.
def skipLocalDb = providers.gradleProperty('skipLocalDb').isPresent()
		|| providers.environmentVariable('CI').isPresent()
		|| providers.environmentVariable('SKIP_LOCAL_DB').map { it == 'true' }.getOrElse(false)

def startLocalDb = tasks.register('startLocalDb', Exec) {
	group = 'application'
	description = 'Starts the local PostgreSQL container (root compose, service-db).'
	workingDir = rootProject.file('../..')
	commandLine 'docker', 'compose', '--profile', 'service', 'up', '-d', '--wait', 'service-db'
	onlyIf { !skipLocalDb }
	ignoreExitValue = true
	doLast {
		if (executionResult.get().exitValue != 0) {
			throw new GradleException('로컬 DB를 띄우지 못했습니다. Docker Desktop이 실행 중인지 확인하세요. '
					+ 'DB를 직접 관리한다면 -PskipLocalDb 로 이 단계를 건너뜁니다.')
		}
	}
}

tasks.named('bootRun') {
	dependsOn startLocalDb
}

tasks.named('test') {
	// 10만 별 측정은 몇 분이 걸려 매 빌드에 넣지 않는다. perfTest로 따로 돌린다.
	useJUnitPlatform {
		excludeTags 'perf'
	}
	dependsOn startLocalDb
	// 실제 자격 증명·개인 프로필을 테스트 컨텍스트에 읽어들이지 않는다.
	systemProperty 'OAUTH_LOCAL_CONFIG', 'optional:classpath:/oauth-test-no-local.properties'
	// 테스트 클래스마다 스키마가 달라 컨텍스트를 다시 쓰지 않는데, 캐시(기본 32개)에 남은 컨텍스트가
	// 연결 풀(최대 10)을 계속 잡아 로컬 DB 연결 한도(100)를 넘는다. 살아 있는 컨텍스트 수를 줄인다 [S15P21C206-139].
	systemProperty 'spring.test.context.cache.maxSize', '4'
	// 기존 MockHttpSession 테스트. 실제 Redis 검증은 테스트 속성으로 다시 활성화한다.
	systemProperty 'planetory.session.redis.enabled', 'false'
	// GitLab CI(dind)에서만 적용한다. 로컬 실행은 바뀌지 않는다 [S15P21C206-91].
	if (providers.environmentVariable('CI').isPresent()) {
		// 멈춘 테스트가 Runner를 붙잡지 않고 이름과 함께 실패하게 한다. 같은 스레드에서 끊어야 한다.
		// SEPARATE_THREAD로 돌리면 @Transactional·보안 컨텍스트가 테스트 스레드와 갈라져 정상 테스트가 깨진다.
		// 인터럽트에 반응하지 않는 대기는 여기서 못 끊으므로 job의 timeout이 마지막 안전장치다.
		systemProperty 'junit.jupiter.execution.timeout.default', '5m'
	}
}

// 대규모 시드 성능 측정 [S15P21C206-137]. ./gradlew perfTest
tasks.register('perfTest', Test) {
	group = 'verification'
	description = '10만 별 시드에서 타일 조회 비용을 측정한다'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'perf'
	}
	dependsOn startLocalDb
	systemProperty 'OAUTH_LOCAL_CONFIG', 'optional:classpath:/oauth-test-no-local.properties'
	// 측정이므로 입력이 같아도 매번 다시 잰다.
	outputs.upToDateWhen { false }
	testLogging {
		showStandardStreams = true
	}
}

tasks.named('jar') {
	enabled = false
}
