spring.application.name=Planetory
# 개인 설정은 Git·Docker 빌드 컨텍스트에서 제외된다. apps/backend에서 실행한다.
spring.config.import=${OAUTH_LOCAL_CONFIG:optional:file:./.env.oauth.properties}
# 프로필을 지정하지 않으면 local로 뜬다(팀원이 설정 없이 실행). 배포 이미지는 Dockerfile에서 prod를 지정한다.
spring.profiles.default=local
# 배포 Compose(infra/service/compose.yaml)와 같은 이름을 사용한다. 로컬 .env의 POSTGRES_*는 문서의 실행 절차에서 매핑한다.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/planetory_poc}
spring.datasource.username=${DATABASE_USER:planetory}
spring.datasource.password=${DATABASE_PASSWORD}
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
# 마이그레이션은 테이블 소유자로, 런타임은 planetory_app을 부여받은 계정으로 접속한다(ADR D5).
# 소유자는 GRANT/REVOKE의 영향을 받지 않으므로 둘을 반드시 다른 계정으로 두어야 분리가 성립한다.
# DATABASE_MIGRATION_*를 주지 않으면 런타임과 같은 계정을 쓴다. 계정을 나누지 않은 환경
# (로컬·테스트)은 동작이 바뀌지 않는다. url은 지정하지 않는다 — Boot가 런타임 연결 주소를
# 가져다 별도 연결을 만들므로, 설정 문자열을 따로 박으면 @ServiceConnection처럼 문자열 없이
# 연결을 바꾸는 테스트에서 Flyway만 다른 DB를 마이그레이션한다.
spring.flyway.user=${DATABASE_MIGRATION_USER:${spring.datasource.username}}
spring.flyway.password=${DATABASE_MIGRATION_PASSWORD:${spring.datasource.password}}
spring.sql.init.mode=never
# 신뢰 프록시의 헤더 정제·직결 차단 인수 후 SERVER_FORWARD_HEADERS_STRATEGY=framework로 활성화한다.
server.forward-headers-strategy=none
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
# JPA: 스키마는 Flyway만 변경한다. 엔티티와 스키마가 어긋나면 기동에 실패한다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# 세션 Redis와 계산 캐시는 별도 인스턴스다. 주소는 환경에서 주입한다.
planetory.redis.session.host=${SESSION_REDIS_HOST}
planetory.redis.session.port=${SESSION_REDIS_PORT}
planetory.redis.session.password=${SESSION_REDIS_PASSWORD:}
planetory.redis.cache.host=${CACHE_REDIS_HOST}
planetory.redis.cache.port=${CACHE_REDIS_PORT}
planetory.redis.cache.password=${CACHE_REDIS_PASSWORD:}
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=SESSION
server.servlet.session.cookie.path=/
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
app.auth.success-url=${AUTH_SUCCESS_URL:/api/v1/me}

# 별 지도 전송 규격 [S15P21C206-137]. 기본값은 지금 동작 그대로다.
# tile-size는 응답 범위의 최소 단위라 조밀한 곳의 첫 화면 비용을 좀우한다.
# 실측 근거는 S15P21C206-137 MR, 최종 값은 215·W05 뷰포트 측정 뒤에 정한다.
planetory.sky.tile-size=512
planetory.sky.max-box=32768

# 온라인 잔차 작업(탐사 API 7장, D-3·D-4). 실제 수치는 부하 시험 뒤 S15P21C206-89와 맞춘다.
planetory.residual.poll-after-seconds=2
planetory.residual.retry-after-seconds=10
planetory.residual.max-running=2
planetory.residual.max-queued=20
planetory.residual.per-member=1

# 내부 경로(/internal/**) 서비스 토큰. 비우면 경로 전체를 막는다 [S15P21C206-150].
planetory.internal.service-token=${INTERNAL_SERVICE_TOKEN:}
