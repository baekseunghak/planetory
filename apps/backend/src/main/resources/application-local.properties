# 로컬 개발 공용 기본값(루트 Compose service-db와 동일). 환경변수를 주면 그 값이 우선한다.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:15432/planetory_poc}
spring.datasource.password=${DATABASE_PASSWORD:ssafy}
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
server.servlet.session.cookie.secure=false
# 초기 운영 규칙 rule-0의 튜토리얼 건너뛰기(SUB-12) [S15P21C206-151]. 개발 환경은 3회 오답 뒤 연다.
# V9가 마이그레이션 연결의 이 세션 설정을 읽고, 설정이 없으면 0(끔, 배포 기본값)으로 넣는다.
spring.flyway.init-sqls=SET planetory.tutorial_skip_after = 3
