# SSAFY 로그인 개발 가이드(2026-09-15). 동의 항목은 개발자센터에서 설정한다.
spring.security.oauth2.client.registration.ssafy.client-name=SSAFY
spring.security.oauth2.client.registration.ssafy.client-id=${SSAFY_CLIENT_ID}
spring.security.oauth2.client.registration.ssafy.client-secret=${SSAFY_CLIENT_SECRET}
spring.security.oauth2.client.registration.ssafy.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.ssafy.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.ssafy.redirect-uri=${SSAFY_REDIRECT_URI}
spring.security.oauth2.client.provider.ssafy.authorization-uri=https://project.ssafy.com/oauth/sso-check
spring.security.oauth2.client.provider.ssafy.token-uri=https://project.ssafy.com/ssafy/oauth2/token
spring.security.oauth2.client.provider.ssafy.user-info-uri=https://project.ssafy.com/ssafy/resources/userInfo
spring.security.oauth2.client.provider.ssafy.user-name-attribute=userId
