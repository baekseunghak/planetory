stages:
  - validate
  - build
  - deploy

include:
  - local: .gitlab/ci/common.yml
  - local: .gitlab/ci/apps/frontend.yml
  - local: .gitlab/ci/apps/backend.yml
  - local: .gitlab/ci/distributed-system/ingestion.yml
  - local: .gitlab/ci/distributed-system/spark.yml
  - local: .gitlab/ci/distributed-system/airflow.yml
  - local: .gitlab/ci/distributed-system/publisher.yml

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # MR이 열린 브랜치는 MR 파이프라인만 돈다. 둘 다 돌면 Runner를 두 배로 쓰고,
    # rules:changes도 MR 파이프라인에서만 타깃 브랜치 기준으로 비교한다.
    # 기본 브랜치는 예외다. develop을 source로 하는 MR이 열려 있으면 develop의
    # 브랜치 파이프라인이 죽는데, build·deploy는 전부 $CI_COMMIT_BRANCH 조건에
    # 걸려 있고 MR 파이프라인에는 그 변수가 없다. job이 실패하는 게 아니라
    # 나타나지 않으므로 파이프라인은 초록인 채 배포만 사라진다.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      when: never
    - if: $CI_COMMIT_BRANCH

default:
  interruptible: true

variables:
  AIRFLOW_BASE_IMAGE: apache/airflow:2.10.5-python3.12
  SPARK_BASE_IMAGE: apache/spark:3.5.5-python3
