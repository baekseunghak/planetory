# 마이그레이션 파일만 검사한다. grep이라 수 초에 끝나므로 JDK 이미지를 끌어오는
# backend:build와 분리했다. 컨트롤러만 고친 MR에서는 아예 돌지 않는다.
backend:schema:
  stage: validate
  # git이 필요하다. 타깃 브랜치의 마이그레이션 번호와 대조해야 선점 충돌을
  # 머지 전에 잡을 수 있다.
  #
  # entrypoint를 비워야 한다. 이 이미지는 ENTRYPOINT가 ["git"]이라 Runner가 붙이는
  # 셸이 `git sh -c ...`로 조립되고 "git: 'sh' is not a git command"로 죽는다.
  # 스크립트가 한 줄도 실행되지 않으므로 검사가 있으나 마나가 된다.
  image:
    name: alpine/git:2.45.2
    entrypoint: [""]
  needs: []
  variables:
    # 이미 적용된 마이그레이션은 검사에서 뺀다. 파일을 고치면 Flyway 체크섬이 바뀌어
    # 기존 DB가 기동을 거부하므로 허용 표시를 넣을 방법이 없다. V5의
    # `ALTER COLUMN layout_ordinal SET NOT NULL`이 여기 해당한다.
    SCHEMA_GRANDFATHERED: "V5__exploration_domain_constraints.sql"
    # PostgreSQL은 COLUMN 키워드를 생략할 수 있고 `RENAME a TO b`처럼 이름이 사이에
    # 끼므로 인접 매칭으로는 잡히지 않는다. 컬럼명에 숫자·따옴표가 들어가는 경우도 있다.
    # 권한 회수와 제약 강화도 구 앱을 깨뜨리므로 같이 본다.
    SCHEMA_IRREVERSIBLE: 'DROP +(TABLE|COLUMN|VIEW|MATERIALIZED|TYPE|SEQUENCE|FUNCTION|TRIGGER)|ALTER +TABLE +[^ ]+ +DROP|RENAME|SET +NOT +NULL|REVOKE|ALTER +COLUMN +[^ ]+ +TYPE'
  script:
    # 1-a. 다른 브랜치가 먼저 쓴 번호를 재사용하면, 머지 뒤 그 번호가 이미 적용된
    #      최대값보다 낮아져 Flyway가 거부한다. V14 주석대로 이 저장소는
    #      out-of-order를 쓰지 않으므로 번호는 항상 앞으로만 가야 한다.
    #      MR에서만 가능한 검사다. 가져오지 못하면 막지 않고 건너뛴다 —
    #      신호를 더할 뿐, 헛되이 차단하지 않는다.
    - |
      DIR=apps/backend/src/main/resources/db/migration
      version_of() { n=${1#V}; echo "${n%%__*}"; }
      TARGET="${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-}"
      if [ -z "$TARGET" ]; then
        echo "브랜치 파이프라인이라 타깃 비교를 건너뜁니다."
      elif ! git fetch --quiet --depth=50 origin "$TARGET" 2>/dev/null; then
        echo "경고: 타깃 브랜치($TARGET)를 가져오지 못해 선점 검사를 건너뜁니다." >&2
      else
        base_max=$(git ls-tree --name-only "origin/$TARGET" -- "$DIR/" | while read -r path; do
          case "${path##*/}" in V*__*.sql) version_of "${path##*/}" ;; esac
        done | sort -n | tail -1)
        if [ -z "$base_max" ]; then
          echo "타깃에 마이그레이션이 없습니다. 선점 검사를 건너뜁니다."
        else
          echo "타깃($TARGET)의 최대 버전: V$base_max"
          taken=0
          for f in "$DIR"/V*.sql; do
            name=${f##*/}
            num=$(version_of "$name")
            case "$num" in ''|*[!0-9]*) continue ;; esac
            git cat-file -e "origin/$TARGET:$DIR/$name" 2>/dev/null && continue
            if [ "$num" -le "$base_max" ]; then
              echo "V$num 는 타깃에 이미 있는 번호이거나 그보다 낮습니다: $name" >&2
              taken=1
            fi
          done
          if [ "$taken" = "1" ]; then
            echo "타깃의 최대 번호(V$base_max)보다 큰 번호로 바꾸십시오." >&2
            exit 1
          fi
          echo "버전 선점 검사 통과"
        fi
      fi
    - cd apps/backend/src/main/resources/db/migration
    # 1-b. 한 브랜치 안에서 같은 번호를 두 번 쓴 경우.
    - |
      numbers=$(ls V*.sql 2>/dev/null | sed -nE 's/^V([0-9]+)__.*/\1/p')
      if [ "$(echo "$numbers" | grep -c .)" != "$(ls V*.sql 2>/dev/null | grep -c .)" ]; then
        echo "이름 규칙에 맞지 않는 마이그레이션이 있습니다. V<정수>__<설명>.sql 이어야 합니다." >&2
        ls V*.sql >&2
        exit 1
      fi
      duplicates=$(echo "$numbers" | sort -n | uniq -d)
      if [ -n "$duplicates" ]; then
        echo "마이그레이션 버전 번호가 겹칩니다: $duplicates" >&2
        exit 1
      fi
    # 2. 열·테이블을 지우거나, 이름을 바꾸거나, 제약을 좁히거나, 권한을 회수하면
    #    구 버전 앱이 새 스키마에서 뜨지 못한다. 배포가 실패했을 때 이미지를
    #    되돌려도 살아나지 않는다는 뜻이다(infra/service/deploy.sh는 이미지만 되돌린다).
    #    주석과 문자열 리터럴은 먼저 걷어낸다. 설명을 썼다는 이유로 막으면
    #    아무도 설명을 쓰지 않게 된다.
    - |
      failed=0
      for file in V*.sql R*.sql; do
        [ -f "$file" ] || continue
        case " $SCHEMA_GRANDFATHERED " in *" $file "*) continue ;; esac
        hits=$(sed -e 's/--.*$//' -e "s/'[^']*'//g" "$file" | grep -niE "$SCHEMA_IRREVERSIBLE" || true)
        [ -n "$hits" ] || continue
        if grep -qiE '^[[:space:]]*--[[:space:]]*IRREVERSIBLE' "$file"; then
          echo "되돌릴 수 없는 변경을 명시적으로 허용했습니다: $file"
          continue
        fi
        failed=1
        echo "되돌릴 수 없는 변경이 있습니다: $file" >&2
        echo "$hits" >&2
      done
      if [ "$failed" = "1" ]; then
        echo "" >&2
        echo "세 배포로 나누면 어느 단계에서 실패해도 이미지 롤백으로 복구됩니다." >&2
        echo "  1차: 새 열을 추가만 한다 (구 앱·신 앱 모두 동작)" >&2
        echo "  2차: 코드가 새 열을 쓰게 바꾼다 (스키마 변경 없음)" >&2
        echo "  3차: 아무도 쓰지 않게 된 구 열을 지운다" >&2
        echo "" >&2
        echo "나눌 수 없다면 파일에 '-- IRREVERSIBLE: <근거>' 줄을 추가하십시오." >&2
        exit 1
      fi
      echo "마이그레이션 검사 통과"
  # 검사 자체를 고칠 때도 돌아야 한다. 지금은 마이그레이션 파일을 억지로
  # 건드려야 검증할 수 있다.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: &schema_paths
        - apps/backend/src/main/resources/db/migration/**/*
        - .gitlab/ci/apps/backend.yml
    - if: $CI_COMMIT_BRANCH
      changes: *schema_paths

# bootJar는 test에 의존하지 않는다. 컴파일과 패키징만 한다.
# 테스트는 넣지 않았다. build.gradle의 test가 PostgreSQL을 요구하는데 CI에서는
# startLocalDb가 건너뛰어지므로(CI=true), 그냥 돌리면 DB 없이 41개 클래스가 돈다.
# CI에 Postgres 서비스를 붙이는 일은 따로 정한다.
backend:build:
  stage: validate
  image: eclipse-temurin:21-jdk-alpine
  needs: []
  variables:
    # Gradle이 프로젝트 캐시로도 쓰는 apps/backend/.gradle 과 겹치지 않게 분리한다.
    GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle-home
  # 캐시를 둘로 나눈다. 하나로 묶으면 build.gradle 한 줄만 고쳐도 키가 바뀌어
  # Gradle 배포판 130MB까지 다시 받는다. 배포판은 wrapper 설정이 바뀔 때만 무효화한다.
  cache:
    - key:
        files: [apps/backend/gradle/wrapper/gradle-wrapper.properties]
        prefix: gradle-dist
      paths: [.gradle-home/wrapper]
    - key:
        files:
          - apps/backend/build.gradle
          - apps/backend/settings.gradle
        prefix: gradle-deps
      paths: [.gradle-home/caches]
  script:
    - cd apps/backend
    - chmod +x gradlew
    - ./gradlew bootJar --no-daemon
  # 추출된 배포판과 원본 zip이 둘 다 남아 캐시가 두 배가 된다.
  after_script:
    - rm -f "$CI_PROJECT_DIR"/.gradle-home/wrapper/dists/*/*/*.zip
  # 문서만 고쳐도 Gradle 빌드가 도는 것을 막는다. 기본 브랜치에서는 build:backend가
  # 이미지 안에서 같은 bootJar를 수행하므로 돌리지 않는다.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: &backend_paths
        - apps/backend/src/**/*
        - apps/backend/build.gradle
        - apps/backend/settings.gradle
        - apps/backend/gradle/**/*
        - apps/backend/gradlew
        - apps/backend/Dockerfile
        - .gitlab/ci/apps/backend.yml
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      changes: *backend_paths

# MR에서 이미지를 실제로 만들어 본다. 푸시는 하지 않는다.
# backend:build가 bootJar까지는 검증하지만 Dockerfile 자체는 검증하지 않는다.
# Dockerfile이 바뀔 때만 돌므로 Gradle 빌드가 중복되는 경우는 드물다.
backend:image:
  extends: .docker-build
  stage: validate
  needs: []
  variables:
    DOCKERFILE: apps/backend/Dockerfile
    IMAGE_NAME: backend
    TARGET_PLATFORM: linux/amd64
    BUILD_ARGS: ""
  before_script: []
  script:
    - docker build --platform "$TARGET_PLATFORM" --file "$DOCKERFILE" --tag "ci-check/backend:$CI_COMMIT_SHORT_SHA" $BUILD_ARGS .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - apps/backend/Dockerfile
        - .gitlab/ci/apps/backend.yml

build:backend:
  extends: .docker-build
  variables:
    DOCKERFILE: apps/backend/Dockerfile
    IMAGE_NAME: backend
    TARGET_PLATFORM: linux/amd64
    BUILD_ARGS: ""
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      exists: [apps/backend/gradlew]
      changes: [apps/backend/**/*]

# 서비스 인스턴스는 EC2-A 하나다(시스템 아키텍처 8장 D4). EC2-B job은 제거했다.
deploy:backend:ec2-a:
  extends: .deploy-ec2-a
  needs: ["build:backend"]
  variables:
    IMAGE_NAME: backend
    DEPLOY_IMAGE_VARIABLE: BACKEND_IMAGE
    DEPLOY_SERVICES: backend
    DEPLOY_ACTION: up
    # GET /actuator/health는 SecurityConfig에서 permitAll이다.
    DEPLOY_HEALTH_PATH: "/actuator/health"
    # 기동과 동시에 Flyway가 돈다. 교체 전에 덤프를 남긴다. 롤백은 이미지만
    # 되돌리므로, 스키마까지 되돌려야 하면 이 덤프가 유일한 수단이다.
    DEPLOY_DB_BACKUP: "true"
    # Gradle 앱은 기동이 느리다. 실측 기준 13초대이나 마이그레이션이 붙으면 늘어난다.
    DEPLOY_HEALTH_TIMEOUT: "180"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      exists: [apps/backend/gradlew]
      changes: [apps/backend/**/*]
      when: manual
