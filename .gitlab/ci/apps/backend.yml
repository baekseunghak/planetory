# 마이그레이션 파일만 검사한다. grep이라 수 초에 끝나므로 JDK 이미지를 끌어오는
# backend:build와 분리했다. 컨트롤러만 고친 MR에서는 아예 돌지 않는다.
backend:schema:
  stage: validate
  # git이 필요하다. 타깃 브랜치의 마이그레이션 번호와 대조해야 선점 충돌을
  # 머지 전에 잡을 수 있다.
  #
  # entrypoint를 비워야 한다. 이 이미지는 ENTRYPOINT가 ["git"]이라 Runner가 붙이는
  # 셸이 `git sh -c ...`로 조립되고 "git: 'sh' is not a git command"로 죽는다.
  # 스크립트가 한 줄도 실행되지 않으므로 검사가 있으나 마나가 된다.
  image:
    name: alpine/git:2.45.2
    entrypoint: [""]
  needs: []
  script:
    # 검사 로직은 apps/backend/scripts/check-migrations.sh에 있다. YAML 안에 두면
    # 로컬에서 돌릴 수 없어, 리뷰에서 나온 우회 사례를 회귀로 고정할 수 없었다.
    #
    # 검사 범위는 타깃 대비 이번에 추가·수정된 파일뿐이다. 작업 트리 전체를 훑던
    # 방식은 이미 병합된 마이그레이션을 계속 다시 잡아, 병합 직후 기본 브랜치의
    # 파이프라인을 멈추게 했다(develop의 V19가 평문 REVOKE 3줄로 걸렸다).
    #
    # 회귀 검사를 먼저 돌려 검사 자체가 망가지지 않았는지 본다. 이것이 없으면
    # 검사를 고칠 때 마이그레이션 파일을 억지로 건드려야 검증할 수 있었다.
    - sh apps/backend/scripts/check-migrations.sh --self-test
    - sh apps/backend/scripts/check-migrations.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: &schema_paths
        - apps/backend/src/main/resources/db/migration/**/*
        - apps/backend/scripts/check-migrations.sh
        - .gitlab/ci/apps/backend.yml
    - if: $CI_COMMIT_BRANCH
      changes: *schema_paths

# 백엔드 Gradle job의 공통 설정. MR 관문(backend:build)과 전체 테스트(backend:test)가 함께 쓴다.
#
# 스키마 격리 테스트(PlanetoryApplicationTests 등)는 DATABASE_URL의 PostgreSQL에 실행마다
# UUID 스키마를 만든다. CI=true라 startLocalDb가 건너뛰어지므로 postgres 서비스를 붙여 그
# 자리를 채운다. 역할·pg_trgm을 만들 수 있게 소유자(superuser)로 접속하며, 로컬 Compose
# 개발 DB와 같은 조건이다.
.backend-gradle:
  image: eclipse-temurin:21-jdk-alpine
  needs: []
  services:
    - name: postgres:18.6-alpine
      alias: service-db
  variables:
    # Gradle이 프로젝트 캐시로도 쓰는 apps/backend/.gradle 과 겹치지 않게 분리한다.
    GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle-home
    # job과 함께 사라지는 CI 전용 DB다. 비밀이 아니므로 파일에 적는다.
    POSTGRES_DB: planetory_poc
    POSTGRES_USER: planetory
    POSTGRES_PASSWORD: ci-validation-only
    DATABASE_URL: jdbc:postgresql://service-db:5432/planetory_poc
    DATABASE_USER: planetory
    DATABASE_PASSWORD: ci-validation-only
  # 캐시를 둘로 나눈다. 하나로 묶으면 build.gradle 한 줄만 고쳐도 키가 바뀌어
  # Gradle 배포판 130MB까지 다시 받는다. 배포판은 wrapper 설정이 바뀔 때만 무효화한다.
  cache:
    - key:
        files: [apps/backend/gradle/wrapper/gradle-wrapper.properties]
        prefix: gradle-dist
      paths: [.gradle-home/wrapper]
    - key:
        files:
          - apps/backend/build.gradle
          - apps/backend/settings.gradle
        prefix: gradle-deps
      paths: [.gradle-home/caches]
  before_script:
    - cd apps/backend
    - chmod +x gradlew
  # 추출된 배포판과 원본 zip이 둘 다 남아 캐시가 두 배가 된다.
  after_script:
    - rm -f "$CI_PROJECT_DIR"/.gradle-home/wrapper/dists/*/*/*.zip
  # 실패한 테스트를 MR 화면에서 바로 본다. 실패 때 가장 필요하므로 항상 올린다.
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: apps/backend/build/test-results/test/TEST-*.xml
    paths:
      - apps/backend/build/reports/tests/test/

# MR 관문. 가볍게 돈다(약 2분) [S15P21C206-91]. 이름은 이전 파이프라인 기록과 이어지도록 유지한다.
# 컴파일·패키징(bootJar)과, 스프링 앱·컨테이너를 띄우지 않는 테스트만 돌린다. 예외로
# PlanetoryApplicationTests를 돌려 실제 PostgreSQL에서 앱 기동·전체 마이그레이션·엔티티 검증
# (ddl-auto=validate)을 확인한다. 고르는 규칙은 build.gradle의 -PmrTests에 있고, 뺀 테스트는
# backend:test가 돈다. dind가 없어 Testcontainers 테스트는 여기서 돌 수 없다.
backend:build:
  extends: .backend-gradle
  stage: validate
  timeout: 15m
  script:
    - ./gradlew bootJar test -PmrTests --no-daemon
  # 문서만 고쳐도 Gradle 빌드가 도는 것을 막는다. 기본 브랜치에서는 돌리지 않는다.
  # build:backend가 이미지 안에서 같은 bootJar를 수행하고, 전체 테스트는 backend:test가 돈다.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: &backend_paths
        - apps/backend/src/**/*
        - apps/backend/build.gradle
        - apps/backend/settings.gradle
        - apps/backend/gradle/**/*
        - apps/backend/gradlew
        - apps/backend/Dockerfile
        - .gitlab/ci/apps/backend.yml
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      changes: *backend_paths

# 전체 테스트(약 8분) [S15P21C206-91]. MR 관문에서 뺀 스프링·Testcontainers 테스트까지 모두 돈다.
# develop 병합 뒤 자동으로 돌고, MR에서는 위험한 변경을 병합 전에 확인할 때 수동으로 누른다.
# 이미지 빌드·배포는 이 job을 기다리지 않는다. needs: []로 바로 시작하고, 마지막 stage에 둬서
# needs가 없는 build:backend가 앞 stage 완료를 기다릴 때 포함되지 않게 한다. 깨지면 파이프라인이 빨갛게 된다.
#
# 역할·권한처럼 클러스터 전역 상태를 건드리는 테스트는 Testcontainers로 일회용 컨테이너를
# 띄운다. dind가 필요하므로 privileged인 amd64-docker Runner에서만 돈다.
backend:test:
  extends: .backend-gradle
  stage: verify
  # 다음 develop 병합이 이 파이프라인을 자동 취소하면, 새 파이프라인에는 백엔드 변경이 없어
  # 전체 테스트가 끝내 돌지 않는다. 시작한 job은 취소되지 않게 한다.
  interruptible: false
  # Runner가 한 대라 멈춘 job이 다른 파이프라인까지 줄 세운다. 테스트별 제한은 build.gradle에 있다.
  timeout: 30m
  tags:
    - amd64-docker
  services:
    - name: postgres:18.6-alpine
      alias: service-db
    - name: docker:27.5-dind
      alias: docker
  variables:
    # Testcontainers가 dind 데몬에 컨테이너를 띄운다. 매핑된 포트는 job 컨테이너의
    # localhost가 아니라 dind 호스트에 열리므로 접속 주소를 docker로 바꾼다.
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: docker
  script:
    # 10분이 지나도 끝나지 않으면 테스트 JVM의 스레드 덤프를 로그에 남긴다. 시간 초과로 끝나면
    # JUnit 보고서가 올라가지 않아, 멈춘 호출을 알 수 있는 곳이 이 덤프뿐이다. 먼저 끝나면 아무것도 찍지 않는다.
    - (sleep 600; for p in $(jcmd -l | awk '/GradleWorkerMain/ {print $1}'); do jcmd "$p" Thread.print; done) &
    - ./gradlew test --no-daemon
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *backend_paths
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *backend_paths
      when: manual
      allow_failure: true
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      changes: *backend_paths
      when: manual
      allow_failure: true

# MR에서 이미지를 실제로 만들어 본다. 푸시는 하지 않는다.
# backend:build가 bootJar까지는 검증하지만 Dockerfile 자체는 검증하지 않는다.
# Dockerfile이 바뀔 때만 돌므로 Gradle 빌드가 중복되는 경우는 드물다.
backend:image:
  extends: .docker-build
  stage: validate
  # 테스트가 실패한 코드로는 이미지를 만들지 않는다 [S15P21C206-91]. backend:build는
  # Dockerfile 변경에도 돌므로 대개 함께 있지만, 없는 파이프라인에서 막히지 않게 optional로 둔다.
  needs:
    - job: backend:build
      optional: true
  variables:
    DOCKERFILE: apps/backend/Dockerfile
    IMAGE_NAME: backend
    TARGET_PLATFORM: linux/amd64
    BUILD_ARGS: ""
  before_script: []
  script:
    - docker build --platform "$TARGET_PLATFORM" --file "$DOCKERFILE" --tag "ci-check/backend:$CI_COMMIT_SHORT_SHA" $BUILD_ARGS .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - apps/backend/Dockerfile
        - .gitlab/ci/apps/backend.yml

build:backend:
  extends: .docker-build
  variables:
    DOCKERFILE: apps/backend/Dockerfile
    IMAGE_NAME: backend
    TARGET_PLATFORM: linux/amd64
    BUILD_ARGS: ""
  # develop에서는 변경 여부와 관계없이 빌드한다. changes로 거르면 이 앱을 바꾸지 않은
  # 병합의 파이프라인에는 배포 버튼이 없고, 이 앱을 바꾼 이전 파이프라인은 새 커밋에
  # 자동 취소되며 누르지 않은 수동 배포까지 함께 사라진다. 2026-09-23 백엔드 병합
  # 4건이 빌드만 되고 배포되지 못했다(S15P21C206-261). 최신 파이프라인에 늘 버튼을 둔다.
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      exists: [apps/backend/gradlew]

# 서비스 인스턴스는 EC2-A 하나다(시스템 아키텍처 8장 D4). EC2-B job은 제거했다.
deploy:backend:ec2-a:
  extends: .deploy-ec2-a
  needs: ["build:backend"]
  variables:
    IMAGE_NAME: backend
    DEPLOY_IMAGE_VARIABLE: BACKEND_IMAGE
    DEPLOY_SERVICES: backend
    DEPLOY_ACTION: up
    # GET /actuator/health는 SecurityConfig에서 permitAll이다.
    DEPLOY_HEALTH_PATH: "/actuator/health"
    # 기동과 동시에 Flyway가 돈다. 교체 전에 덤프를 남긴다. 롤백은 이미지만
    # 되돌리므로, 스키마까지 되돌려야 하면 이 덤프가 유일한 수단이다.
    DEPLOY_DB_BACKUP: "true"
    # Gradle 앱은 기동이 느리다. 실측 기준 13초대이나 마이그레이션이 붙으면 늘어난다.
    DEPLOY_HEALTH_TIMEOUT: "180"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      exists: [apps/backend/gradlew]
      when: manual
