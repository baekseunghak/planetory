# 마이그레이션 파일만 검사한다. grep이라 수 초에 끝나므로 JDK 이미지를 끌어오는
# backend:build와 분리했다. 컨트롤러만 고친 MR에서는 아예 돌지 않는다.
backend:schema:
  stage: validate
  image: alpine:3.20
  needs: []
  variables:
    # 이미 적용된 마이그레이션은 검사에서 뺀다. 파일을 고치면 Flyway 체크섬이 바뀌어
    # 기존 DB가 기동을 거부하므로 허용 표시를 넣을 방법이 없다. V5의
    # `ALTER COLUMN layout_ordinal SET NOT NULL`이 여기 해당한다.
    SCHEMA_GRANDFATHERED: "V5__exploration_domain_constraints.sql"
    # PostgreSQL은 COLUMN 키워드를 생략할 수 있고 `RENAME a TO b`처럼 이름이 사이에
    # 끼므로 인접 매칭으로는 잡히지 않는다. 컬럼명에 숫자·따옴표가 들어가는 경우도 있다.
    # 권한 회수와 제약 강화도 구 앱을 깨뜨리므로 같이 본다.
    SCHEMA_IRREVERSIBLE: 'DROP +(TABLE|COLUMN|VIEW|MATERIALIZED|TYPE|SEQUENCE|FUNCTION|TRIGGER)|ALTER +TABLE +[^ ]+ +DROP|RENAME|SET +NOT +NULL|REVOKE|ALTER +COLUMN +[^ ]+ +TYPE'
  script:
    - cd apps/backend/src/main/resources/db/migration
    # 1. 같은 번호를 두 파일이 쓰면 Flyway 적용 순서가 꼬인다.
    #    현재 체크아웃된 파일만 본다. 다른 브랜치가 같은 번호를 선점한 경우는
    #    develop에 머지된 뒤에야 잡힌다. 타깃 브랜치와 비교하려면 job에 git이 필요하다.
    - |
      numbers=$(ls V*.sql 2>/dev/null | sed -nE 's/^V([0-9]+)__.*/\1/p')
      if [ "$(echo "$numbers" | grep -c .)" != "$(ls V*.sql 2>/dev/null | grep -c .)" ]; then
        echo "이름 규칙에 맞지 않는 마이그레이션이 있습니다. V<정수>__<설명>.sql 이어야 합니다." >&2
        ls V*.sql >&2
        exit 1
      fi
      duplicates=$(echo "$numbers" | sort -n | uniq -d)
      if [ -n "$duplicates" ]; then
        echo "마이그레이션 버전 번호가 겹칩니다: $duplicates" >&2
        exit 1
      fi
    # 2. 열·테이블을 지우거나, 이름을 바꾸거나, 제약을 좁히거나, 권한을 회수하면
    #    구 버전 앱이 새 스키마에서 뜨지 못한다. 배포가 실패했을 때 이미지를
    #    되돌려도 살아나지 않는다는 뜻이다(infra/service/deploy.sh는 이미지만 되돌린다).
    #    주석과 문자열 리터럴은 먼저 걷어낸다. 설명을 썼다는 이유로 막으면
    #    아무도 설명을 쓰지 않게 된다.
    - |
      failed=0
      for file in V*.sql R*.sql; do
        [ -f "$file" ] || continue
        case " $SCHEMA_GRANDFATHERED " in *" $file "*) continue ;; esac
        hits=$(sed -e 's/--.*$//' -e "s/'[^']*'//g" "$file" | grep -niE "$SCHEMA_IRREVERSIBLE" || true)
        [ -n "$hits" ] || continue
        if grep -qiE '^[[:space:]]*--[[:space:]]*IRREVERSIBLE' "$file"; then
          echo "되돌릴 수 없는 변경을 명시적으로 허용했습니다: $file"
          continue
        fi
        failed=1
        echo "되돌릴 수 없는 변경이 있습니다: $file" >&2
        echo "$hits" >&2
      done
      if [ "$failed" = "1" ]; then
        echo "" >&2
        echo "세 배포로 나누면 어느 단계에서 실패해도 이미지 롤백으로 복구됩니다." >&2
        echo "  1차: 새 열을 추가만 한다 (구 앱·신 앱 모두 동작)" >&2
        echo "  2차: 코드가 새 열을 쓰게 바꾼다 (스키마 변경 없음)" >&2
        echo "  3차: 아무도 쓰지 않게 된 구 열을 지운다" >&2
        echo "" >&2
        echo "나눌 수 없다면 파일에 '-- IRREVERSIBLE: <근거>' 줄을 추가하십시오." >&2
        exit 1
      fi
      echo "마이그레이션 검사 통과"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [apps/backend/src/main/resources/db/migration/**/*]
    - if: $CI_COMMIT_BRANCH
      changes: [apps/backend/src/main/resources/db/migration/**/*]

# bootJar는 test에 의존하지 않는다. 컴파일과 패키징만 한다.
# 테스트는 넣지 않았다. build.gradle의 test가 PostgreSQL을 요구하는데 CI에서는
# startLocalDb가 건너뛰어지므로(CI=true), 그냥 돌리면 DB 없이 41개 클래스가 돈다.
# CI에 Postgres 서비스를 붙이는 일은 따로 정한다.
backend:build:
  stage: validate
  image: eclipse-temurin:21-jdk-alpine
  needs: []
  variables:
    GRADLE_USER_HOME: $CI_PROJECT_DIR/apps/backend/.gradle
  # Gradle 배포판(9.7.1)과 의존성을 캐싱한다. 없으면 매번 수백 MB를 내려받는다.
  cache:
    key:
      files:
        - apps/backend/build.gradle
        - apps/backend/gradle/wrapper/gradle-wrapper.properties
    paths:
      - apps/backend/.gradle/caches
      - apps/backend/.gradle/wrapper
  script:
    - cd apps/backend
    - chmod +x gradlew
    - ./gradlew bootJar --no-daemon
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: [apps/backend/**/*]
    - if: $CI_COMMIT_BRANCH
      changes: [apps/backend/**/*]

build:backend:
  extends: .docker-build
  variables:
    DOCKERFILE: apps/backend/Dockerfile
    IMAGE_NAME: backend
    TARGET_PLATFORM: linux/amd64
    BUILD_ARGS: ""
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      exists: [apps/backend/gradlew]
      changes: [apps/backend/**/*]

# 서비스 인스턴스는 EC2-A 하나다(시스템 아키텍처 8장 D4). EC2-B job은 제거했다.
deploy:backend:ec2-a:
  extends: .deploy-ec2-a
  needs: ["build:backend"]
  variables:
    IMAGE_NAME: backend
    DEPLOY_IMAGE_VARIABLE: BACKEND_IMAGE
    DEPLOY_SERVICES: backend
    DEPLOY_ACTION: up
    # GET /actuator/health는 SecurityConfig에서 permitAll이다.
    DEPLOY_HEALTH_PATH: "/actuator/health"
    # 기동과 동시에 Flyway가 돈다. 교체 전에 덤프를 남긴다. 롤백은 이미지만
    # 되돌리므로, 스키마까지 되돌려야 하면 이 덤프가 유일한 수단이다.
    DEPLOY_DB_BACKUP: "true"
    # Gradle 앱은 기동이 느리다. 실측 기준 13초대이나 마이그레이션이 붙으면 늘어난다.
    DEPLOY_HEALTH_TIMEOUT: "180"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      exists: [apps/backend/gradlew]
      changes: [apps/backend/**/*]
      when: manual
