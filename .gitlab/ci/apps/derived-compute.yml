# 온라인 잔차·주기도 Worker [S15P21C206-88]. 테스트는 MR에서, 이미지 빌드·배포는 기본 브랜치에서 돈다.

# 계약 fixture 재생·합성 곡선·HTTP 경계 검사. 이미지와 같은 해시 고정 의존성으로 돈다.
derived-compute:test:
  stage: validate
  image: python:3.12-slim
  needs: []
  script:
    - pip install --no-cache-dir --require-hashes -r apps/derived-compute/requirements.txt
    - pip install --no-cache-dir --no-deps ./libs/astro-kernel
    - pip install --no-cache-dir "pytest>=8.0,<10"
    - cd apps/derived-compute && python -m pytest -q
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - apps/derived-compute/**/*
        - libs/astro-kernel/astro_kernel/**/*
        - contracts/derived-compute/**/*
        - .gitlab/ci/apps/derived-compute.yml

# develop에서는 변경 여부와 관계없이 빌드한다. 이유는 build:backend 주석과 같다(S15P21C206-261).
build:derived-compute:
  extends: .docker-build-arm64
  variables:
    DOCKERFILE: apps/derived-compute/Dockerfile
    IMAGE_NAME: derived-compute
    BUILD_ARGS: ""
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      exists: [apps/derived-compute/requirements.txt]

# 호스트 포트가 없어 deploy.sh의 HTTP 확인을 쓸 수 없다. HEALTH_PATH를 비우고 이미지 HEALTHCHECK에 맡긴다.
deploy:derived-compute:donh-vnic:
  extends: .deploy-donh-vnic
  needs: ["build:derived-compute"]
  variables:
    IMAGE_NAME: derived-compute
    DEPLOY_IMAGE_VARIABLE: DERIVED_COMPUTE_IMAGE
    DEPLOY_SERVICES: derived-compute
    DEPLOY_ACTION: up
    DEPLOY_HEALTH_PATH: ""
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      exists: [apps/derived-compute/requirements.txt]
      when: manual
