validate:compose:
  stage: validate
  image: docker:27.5-cli
  variables:
    POSTGRES_PASSWORD: ci-validation-only
    AIRFLOW_DB_PASSWORD: ci-validation-only
    AIRFLOW_FERNET_KEY: ci-validation-only
    AIRFLOW_WEBSERVER_SECRET_KEY: ci-validation-only
    AIRFLOW_DATABASE_URL: postgresql+psycopg2://airflow:ci-validation-only@127.0.0.1:5432/airflow
    GCP_NODE_1_PROJECT: ci-node-1-project
    GCP_NODE_2_PROJECT: ci-node-2-project
    GCP_NODE_3_PROJECT: ci-node-3-project
    GCP_NODE_4_PROJECT: ci-node-4-project
    GCP_NODE_5_PROJECT: ci-node-5-project
    GCP_NODE_6_PROJECT: ci-node-6-project
  script:
    - docker compose -f compose.yaml config -q
    - docker compose -f infra/distributed-system/compose.control-plane.yaml config -q
    - docker compose -f infra/distributed-system/compose.worker.yaml config -q
  rules:
    - changes:
        - compose.yaml
        - .dockerignore
        - apps/**/Dockerfile
        - distributed-system/**/Dockerfile
        - experiments/distributed-pipeline/compose.yaml
        - infra/**/*.yaml
        - .gitlab-ci.yml
        - .gitlab/ci/**/*.yml

validate:hadoop-config:
  stage: validate
  image: python:3.12-alpine
  script:
    - python infra/distributed-system/validate.py
  rules:
    - changes:
        - infra/distributed-system/**/*.xml
        - infra/distributed-system/**/workers
        - infra/distributed-system/scripts/*yarn*
        - infra/distributed-system/validate.py
        - infra/distributed-system/*.yaml
        - .gitlab/ci/common.yml

validate:tess-hdfs-loader:
  stage: validate
  image: python:3.12-alpine
  variables:
    PYTHONDONTWRITEBYTECODE: "1"
  script:
    - python distributed-system/ingestion/hdfs/test_tess_hdfs_load.py
  rules:
    - changes:
        - distributed-system/ingestion/hdfs/**/*.py
        - infra/distributed-system/scripts/*tess-hdfs-load.ps1
        - .gitlab/ci/common.yml

.docker-build:
  stage: build
  image: docker:27.5-cli
  # amd64 Runner에서만 실행한다. 다른 Runner로 가면 에뮬레이션 설정 없이 amd64 빌드가 실패한다.
  tags:
    - amd64-docker
  services:
    - docker:27.5-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  # buildx를 쓰지 않는다. buildx의 container driver는 dind 안에 buildkit 컨테이너를 따로 띄우고
  # push를 그 컨테이너가 수행하는데, Runner의 extra_hosts가 거기까지 닿지 않아 레지스트리 이름 해석에 실패한다.
  # 일반 build·push는 dind 데몬이 직접 수행하므로 dind에 적용된 extra_hosts를 그대로 쓴다.
  before_script:
    - test -n "$REGISTRY_IMAGE_PREFIX"
  script:
    - docker build --platform "$TARGET_PLATFORM" --file "$DOCKERFILE" --tag "$REGISTRY_IMAGE_PREFIX/$IMAGE_NAME:$CI_COMMIT_SHA" $BUILD_ARGS .
    - docker push "$REGISTRY_IMAGE_PREFIX/$IMAGE_NAME:$CI_COMMIT_SHA"

.remote-compose-deploy:
  stage: deploy
  image: alpine:3.20
  # 배포 중에 취소되면 compose가 반쯤 교체된 상태로 남고 deploy.sh의 롤백도 돌지 못한다.
  # 루트의 default: interruptible: true 를 배포에서만 끈다.
  interruptible: false
  variables:
    # 서비스 배포 job이 덮어쓴다. 비어 있으면 교체만 하고 확인·롤백을 하지 않는다.
    DEPLOY_HEALTH_PATH: ""
    DEPLOY_HEALTH_PORT: "8080"
    DEPLOY_HEALTH_TIMEOUT: "90"
    DEPLOY_DB_BACKUP: "false"
  # SSH 키를 두지 않는다. 대상 노드가 Tailscale SSH로 22번을 처리하므로
  # authorized_keys가 아니라 tailnet 신원으로 인증한다. job 컨테이너의 연결은
  # Runner 호스트의 tailnet 신원으로 나가고, ACL의 ssh 규칙이 deploy 계정을
  # 허용한다. 키를 배포해도 쓰이지 않으면서 회수 대상만 늘어난다.
  # 접근을 끊으려면 ACL에서 해당 규칙을 지운다.
  before_script:
    - apk add --no-cache openssh-client
    - install -d -m 700 ~/.ssh
    # 호스트 키 검증은 Tailscale SSH가 맡는다.
    - printf 'StrictHostKeyChecking accept-new\nConnectTimeout 15\n' > ~/.ssh/config
    - chmod 600 ~/.ssh/config
  # 교체·헬스 확인·롤백은 infra/service/deploy.sh가 배포 노드에서 수행한다.
  # 한 줄짜리 ssh 명령으로는 어느 단계에서 실패했는지 구분할 수 없고, 실패했을 때
  # 되돌릴 대상을 기억할 수도 없다. DEPLOY_HEALTH_PATH가 비면 확인과 롤백을
  # 건너뛰므로 헬스 경로가 없는 GCP 노드 배포는 이전과 같이 동작한다.
  script:
    - test -n "$DEPLOY_HOST" && test -n "$DEPLOY_PATH" && test -n "$DEPLOY_USER"
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
    # 임시 이름으로 받고 원격에서 옮긴다. 다른 배포가 진행 중일 때 실행 중인
    # 파일을 덮어쓰면 sh가 중간부터 엉뚱한 바이트를 읽는다.
    - scp "$DEPLOY_COMPOSE_SOURCE" "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/compose.yaml.incoming"
    - scp infra/service/deploy.sh "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/deploy.sh.incoming"
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && mv compose.yaml.incoming compose.yaml && mv deploy.sh.incoming deploy.sh"
    - export FULL_IMAGE="$REGISTRY_IMAGE_PREFIX/$IMAGE_NAME:$CI_COMMIT_SHA"
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && SERVICE='$DEPLOY_SERVICES' IMAGE_VAR='$DEPLOY_IMAGE_VARIABLE' IMAGE='$FULL_IMAGE' ACTION='$DEPLOY_ACTION' HEALTH_PATH='$DEPLOY_HEALTH_PATH' HEALTH_PORT='$DEPLOY_HEALTH_PORT' HEALTH_TIMEOUT='$DEPLOY_HEALTH_TIMEOUT' DB_BACKUP='$DEPLOY_DB_BACKUP' sh deploy.sh"

.deploy-ec2-a:
  extends: .remote-compose-deploy
  variables:
    DEPLOY_HOST: $EC2_A_HOST
    DEPLOY_PATH: $EC2_A_DEPLOY_PATH
    DEPLOY_COMPOSE_SOURCE: infra/service/compose.yaml

