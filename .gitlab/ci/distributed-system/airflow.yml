build:airflow:
  extends: .docker-build
  variables:
    DOCKERFILE: distributed-system/airflow/Dockerfile
    IMAGE_NAME: airflow
    TARGET_PLATFORM: linux/amd64
    BUILD_ARGS: "--build-arg AIRFLOW_IMAGE=$AIRFLOW_BASE_IMAGE"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      exists: [distributed-system/airflow/requirements.txt]
      changes: [distributed-system/airflow/**/*]

# Airflow 3 services are replaced only by the Node 1 release script
# (infra/distributed-system/scripts/deploy-tess-airflow-node1.sh --update), which
# enforces zero active DagRuns, DAG import checks, and Triggerer health. A generic
# compose deploy from CI would bypass those gates, so no CI deploy job exists.
