build:airflow:
  extends: .docker-build
  variables:
    DOCKERFILE: distributed-system/airflow/Dockerfile
    IMAGE_NAME: airflow
    TARGET_PLATFORM: linux/arm64
    BUILD_ARGS: "--build-arg AIRFLOW_IMAGE=$AIRFLOW_BASE_IMAGE"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      exists: [distributed-system/airflow/requirements.txt]
      changes: [distributed-system/airflow/**/*]

deploy:airflow:oci-a:
  extends: .deploy-oci-a
  needs: ["build:airflow"]
  variables:
    IMAGE_NAME: airflow
    DEPLOY_IMAGE_VARIABLE: AIRFLOW_IMAGE
    DEPLOY_SERVICES: airflow-scheduler airflow-webserver
    DEPLOY_ACTION: up
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      exists: [distributed-system/airflow/requirements.txt]
      changes: [distributed-system/airflow/**/*]
      when: manual
