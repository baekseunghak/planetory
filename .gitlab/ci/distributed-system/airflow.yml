build:airflow:
  extends: .docker-build
  variables:
    DOCKERFILE: distributed-system/airflow/Dockerfile
    IMAGE_NAME: airflow
    TARGET_PLATFORM: linux/amd64
    BUILD_ARGS: "--build-arg AIRFLOW_IMAGE=$AIRFLOW_BASE_IMAGE"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      exists: [distributed-system/airflow/requirements.txt]
      changes: [distributed-system/airflow/**/*]

deploy:airflow:gcp-node-1:
  extends: .deploy-gcp-node-1
  needs: ["build:airflow"]
  variables:
    IMAGE_NAME: airflow
    DEPLOY_IMAGE_VARIABLE: AIRFLOW_IMAGE
    DEPLOY_SERVICES: airflow-db airflow-scheduler airflow-webserver
    DEPLOY_ACTION: up
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      exists: [distributed-system/airflow/requirements.txt]
      changes: [distributed-system/airflow/**/*]
      when: manual
