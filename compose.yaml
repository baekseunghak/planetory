name: planetory-local

include:
  - path: experiments/distributed-pipeline/compose.yaml

services:
  frontend:
    profiles: ["service"]
    platform: ${LOCAL_APP_PLATFORM:-linux/amd64}
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: development
    volumes:
      - ./apps/frontend:/workspace
      - frontend-node-modules:/workspace/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    networks:
      - service

  backend:
    profiles: ["service"]
    platform: ${LOCAL_APP_PLATFORM:-linux/amd64}
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: development
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://service-db:5432/planetory_poc
      SPRING_DATASOURCE_USERNAME: planetory
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ssafy}
      SPRING_PROFILES_ACTIVE: local
      SKIP_LOCAL_DB: "true"
      SESSION_REDIS_HOST: session-redis
      SESSION_REDIS_PORT: "6379"
      CACHE_REDIS_HOST: cache-redis
      CACHE_REDIS_PORT: "6379"
      NOTIFICATION_SIGNING_KEY: ${NOTIFICATION_SIGNING_KEY:-}
      GRADLE_USER_HOME: /root/.gradle
    volumes:
      - ./apps/backend:/workspace
      - backend-gradle-cache:/root/.gradle
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - service
    depends_on:
      service-db:
        condition: service_healthy
      session-redis:
        condition: service_started
      cache-redis:
        condition: service_started

  # 세션과 계산 캐시는 별도 인스턴스여야 한다(RedisSessionConfig). 호스트 포트는
  # local 프로필 기본값과 같아 호스트의 bootRun·IDE 실행도 이 둘을 쓴다.
  session-redis:
    profiles: ["service"]
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:16379:6379"
    networks:
      - service

  cache-redis:
    profiles: ["service"]
    image: redis:7.4-alpine
    command: ["redis-server", "--save", ""]
    ports:
      - "127.0.0.1:16380:6379"
    networks:
      - service

  ingestion:
    profiles: ["pipeline"]
    platform: ${LOCAL_DATA_PLATFORM:-linux/amd64}
    build:
      context: .
      dockerfile: distributed-system/ingestion/Dockerfile
    volumes:
      - ./distributed-system/ingestion:/app
    networks:
      - hadoop
    depends_on:
      - namenode

  spark-submit:
    profiles: ["pipeline"]
    platform: ${LOCAL_DATA_PLATFORM:-linux/amd64}
    build:
      context: .
      dockerfile: distributed-system/spark/Dockerfile
      args:
        SPARK_IMAGE: ${SPARK_IMAGE:-apache/spark:3.5.5-python3}
    networks:
      - hadoop
    depends_on:
      - resourcemanager
      - nodemanager-1
      - nodemanager-2

  airflow:
    profiles: ["pipeline"]
    platform: ${LOCAL_DATA_PLATFORM:-linux/amd64}
    build:
      context: .
      dockerfile: distributed-system/airflow/Dockerfile
      args:
        AIRFLOW_IMAGE: ${AIRFLOW_IMAGE:-apache/airflow:2.10.5-python3.12}
    command: ["standalone"]
    volumes:
      - ./distributed-system/airflow/dags:/opt/airflow/dags
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - hadoop
    depends_on:
      - resourcemanager

  publisher:
    profiles: ["pipeline"]
    platform: ${LOCAL_DATA_PLATFORM:-linux/amd64}
    build:
      context: .
      dockerfile: distributed-system/publisher/Dockerfile
    volumes:
      - ./distributed-system/publisher:/app
    networks:
      - hadoop
      - service
    depends_on:
      service-db:
        condition: service_healthy

volumes:
  frontend-node-modules:
  backend-gradle-cache:
